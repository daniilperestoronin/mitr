# mitr Configuration File
# ========================
#
# This is the default configuration for mitr terminal emulator.
# Copy this file to one of these locations to customize:
#   - $XDG_CONFIG_HOME/mitr/mitr.yml
#   - ~/.config/mitr/mitr.yml
#
# You can also specify a custom config file with: mitr --config /path/to/config.yml

# Window Settings
# ---------------
window:
  width: 800              # Window width in pixels
  height: 600             # Window height in pixels
  opacity: 1.0            # Window opacity (0.0 = transparent, 1.0 = opaque)
  resizable: true         # Allow the window to be resized
  padding:
    x: 2                  # Horizontal padding in pixels
    y: 2                  # Vertical padding in pixels

# Font Settings
# -------------
font:
  family: "JetBrains Mono"  # Family resolved through Fontconfig / CoreText
  path: ""                  # Explicit font file; empty resolves family
  fallback_path: ""         # Explicit second face; empty uses system fallback
  size: 16                  # Font size in points (scaled by HiDPI)

# Cursor Settings
# ---------------
cursor:
  style: block              # Cursor style: block | underline | bar
  blink: false              # Enable cursor blinking (disabled for performance)
  blink_interval: 500       # Blink interval in milliseconds
  color: "#c0c0c0"         # Cursor color

# Colors
# ------
# Color format: "#RRGGBB" (hex RGB). Copy a palette from the examples at
# the bottom of this file over this section to switch schemes.
# ANSI slots also accept color0..color15. `cursor` here aliases cursor.color.
colors:
  # Default colors
  foreground: "#e5e5e5"    # Default text color
  background: "#000000"    # Default background color
  selection: "#6496ff"     # Selection highlight color

  # Normal ANSI colors (0-7)
  black:   "#000000"
  red:     "#cd3131"
  green:   "#0dbc79"
  yellow:  "#e5e510"
  blue:    "#2472c8"
  magenta: "#bc3fbc"
  cyan:    "#11a8cd"
  white:   "#e5e5e5"

  # Bright ANSI colors (8-15)
  bright_black:   "#666666"
  bright_red:     "#f14c4c"
  bright_green:   "#23d18b"
  bright_yellow:  "#f5f543"
  bright_blue:    "#3b8eea"
  bright_magenta: "#d670d6"
  bright_cyan:    "#29b8db"
  bright_white:   "#ffffff"

# Terminal Settings
# -----------------
terminal:
  shell: ""                 # Shell to run (empty = $SHELL or /bin/sh)
  term: "xterm-256color"    # TERM environment variable
  scrollback_lines: 10000   # Number of lines in scrollback buffer
  bold_is_bright: true      # Bold text uses bright colors (8-15)
  osc52: off                # OSC 52 clipboard writes: off | confirm | on

# ========================
# Color scheme examples
# ========================
#
# There is no theme-name switcher. To apply a palette, copy its `colors:`
# block over the `colors:` section above. Keys match the parser:
# foreground, background, selection, cursor, black..white, bright_*.
# `cursor` here is the same as cursor.color in the cursor section.
# With terminal.bold_is_bright: true, include the bright_* colors.

